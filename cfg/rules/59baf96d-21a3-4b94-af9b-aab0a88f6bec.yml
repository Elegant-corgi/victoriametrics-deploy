- name: ping丢包告警
  interval: 30s
  rules:
  - alert: 04ede759922d90424cf525a7757a326b
    expr: (max_over_time(((100 * clamp_min(1 - (increase(smokeping_response_duration_seconds_count{data_center_id="59baf96d-21a3-4b94-af9b-aab0a88f6bec"}[20m])
      / clamp_min(increase(smokeping_requests_total{data_center_id="59baf96d-21a3-4b94-af9b-aab0a88f6bec"}[20m]),
      1)), 0)) > bool 2)[3d:5m]) > 0) unless (min_over_time(((100 * clamp_min(1 -
      (increase(smokeping_response_duration_seconds_count{data_center_id="59baf96d-21a3-4b94-af9b-aab0a88f6bec"}[20m])
      / clamp_min(increase(smokeping_requests_total{data_center_id="59baf96d-21a3-4b94-af9b-aab0a88f6bec"}[20m]),
      1)), 0)) > bool 2)[3d:5m]) > 0)
    for: 0s
    labels:
      alert_template: ping丢包告警
      alert_template_id: 7c65c85f-2698-4ac8-8156-6790c643d8b4
      info: 20分钟丢包率超过2%
      severity: 主要
    annotations:
      description: 'This alert is triggered by rule: (max_over_time(((100 * clamp_min(1
        - (increase(smokeping_response_duration_seconds_count{data_center_id="59baf96d-21a3-4b94-af9b-aab0a88f6bec"}[20m])
        / clamp_min(increase(smokeping_requests_total{data_center_id="59baf96d-21a3-4b94-af9b-aab0a88f6bec"}[20m]),
        1)), 0)) > bool 2)[3d:5m]) > 0) unless (min_over_time(((100 * clamp_min(1
        - (increase(smokeping_response_duration_seconds_count{data_center_id="59baf96d-21a3-4b94-af9b-aab0a88f6bec"}[20m])
        / clamp_min(increase(smokeping_requests_total{data_center_id="59baf96d-21a3-4b94-af9b-aab0a88f6bec"}[20m]),
        1)), 0)) > bool 2)[3d:5m]) > 0) in data center 59baf96d-21a3-4b94-af9b-aab0a88f6bec.
        Check cycle: 30s'
      summary: Alert 04ede759922d90424cf525a7757a326b in ping丢包告警 template
