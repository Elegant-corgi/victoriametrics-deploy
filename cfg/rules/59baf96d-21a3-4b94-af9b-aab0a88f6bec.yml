      Logging Disabled"} > 0
    for: 300s
    labels:
      alert_template: BMC-日志事件关闭
      alert_template_id: 12f304e4-bd94-4980-b68a-4274b1ae3fb3
      severity: 次要
    annotations:
      description: 'This alert is triggered by rule: ipmi_sensor_state{data_center_id="59baf96d-21a3-4b94-af9b-aab0a88f6bec",type="Event
        Logging Disabled"} > 0 in data center 59baf96d-21a3-4b94-af9b-aab0a88f6bec.
        Check cycle: 60s'
      summary: Alert ff4e4c3d146d59ffa47ed5c28317305c in BMC-日志事件关闭 template
      trigger_value: '{{ if eq (printf "%.0f" $value) (printf "%v" $value) }}{{ printf
        "%.0f" $value }}{{ else }}{{ printf "%.2f" $value }}{{ end }}'
      value: '{{ $value }}'
